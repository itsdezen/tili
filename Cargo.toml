[workspace]
resolver = "2"
members = [
    "crates/tili-tree",
    "crates/tili-config",
    "crates/tili-ipc",
    "crates/tili-ax",
    "crates/tili-daemon",
    "crates/tili-cli",
    "crates/tili-menubar",
    "xtask",
]

[workspace.package]
version = "0.1.16"
edition = "2024"
license = "MIT"
repository = "https://github.com/itsdezen/tili"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "sync", "time", "io-util", "signal"] }
clap = { version = "4", features = ["derive"] }

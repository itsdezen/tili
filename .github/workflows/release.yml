name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Never publish a release that hasn't passed the same gate as a normal PR.
  gate:
    name: fmt, clippy, test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  build:
    name: build (${{ matrix.target }})
    needs: gate
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    # Job-level env so the "Import signing certificate" step's `if:` can
    # check `env.TILI_SIGNING_CERTIFICATE_P12` — `secrets.*` isn't a
    # recognized named-value inside step `if:` expressions (a real GitHub
    # Actions restriction, not a typo), so it has to be routed through env
    # first.
    env:
      TILI_SIGNING_CERTIFICATE_P12: ${{ secrets.TILI_SIGNING_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      # Only meaningful once TILI_SIGNING_CERTIFICATE_P12 is added as a repo
      # secret (see CONTRIBUTING.md's Release Engineering section) — until
      # then this step is skipped entirely, `TILI_SIGN_IDENTITY` is never
      # set, and `xtask package` below ships unsigned, same as a local/test
      # build.
      - name: Import signing certificate
        if: ${{ env.TILI_SIGNING_CERTIFICATE_P12 != '' }}
        env:
          TILI_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.TILI_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="runner.keychain-db"
          security create-keychain -p "" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$TILI_SIGNING_CERTIFICATE_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$keychain" -P "$TILI_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain"
          rm -f cert.p12
          identity=$(security find-identity -v -p codesigning "$keychain" | head -1 | grep -oE '"[^"]+"' | tr -d '"')
          echo "TILI_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo run -p xtask -- package --target ${{ matrix.target }} --version "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: tili-${{ matrix.target }}
          path: |
            tili-*.tar.gz
            tili-*.tar.gz.sha256

  publish:
    name: publish GitHub release
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # TODO: once TILI_SIGNING_CERTIFICATE_P12 is added as a repo secret
      # (see CONTRIBUTING.md's Release Engineering section), update this
      # body to drop the "unsigned" warning — `xtask package` will already
      # be signing binaries at that point, this text just hasn't caught up.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: dist/*
          body: |
            ⚠️ **Unsigned development build.** tili does not codesign or
            notarize release binaries yet — the self-signed certificate this
            project's release strategy depends on
            (see [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md#release-engineering))
            hasn't been generated. macOS Gatekeeper will block these on
            first launch; run `xattr -d com.apple.quarantine tili.app` or
            right-click → Open to proceed. Not recommended for daily use
            before v1.0.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            for what changed.

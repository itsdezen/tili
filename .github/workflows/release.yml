name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is normally pushed alongside main, so its CI run may still be in
  # progress. Wait for that exact commit's required check instead of running
  # fmt/clippy/test a second time in parallel.
  gate:
    name: verify CI gate
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Wait for commit CI
        uses: actions/github-script@v7
        with:
          script: |
            // Every job the tag's commit must pass, including the website one:
            // the release body links to this version's anchor on the website
            // changelog, so shipping while that page is broken would publish a
            // dead link.
            const required = ['fmt, clippy, test, build', 'website'];
            const terminalFailures = new Set([
              'action_required', 'cancelled', 'failure', 'stale',
              'startup_failure', 'timed_out',
            ]);
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                filter: 'latest',
              });
              const runs = required.map(name =>
                data.check_runs.find(run => run.name === name),
              );
              const failed = runs.find(run => terminalFailures.has(run?.conclusion));
              if (failed) {
                core.setFailed(`CI gate concluded ${failed.conclusion}: ${failed.html_url}`);
                return;
              }
              if (runs.every(run => run?.conclusion === 'success')) {
                core.info('CI gate passed: ' + runs.map(run => run.name).join(', '));
                return;
              }
              core.info(
                'Waiting for CI gate (' +
                  runs
                    .map(run => `${run?.name ?? 'missing'}: ${run?.status ?? 'not started'}`)
                    .join(', ') +
                  ')',
              );
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Timed out waiting for the commit CI gate');

  build:
    name: build (${{ matrix.target }})
    needs: gate
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    # Job-level env so the "Import signing certificate" step's `if:` can
    # check `env.TILI_SIGNING_CERTIFICATE_P12` — `secrets.*` isn't a
    # recognized named-value inside step `if:` expressions (a real GitHub
    # Actions restriction, not a typo), so it has to be routed through env
    # first.
    env:
      TILI_SIGNING_CERTIFICATE_P12: ${{ secrets.TILI_SIGNING_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      # Only meaningful once TILI_SIGNING_CERTIFICATE_P12 is added as a repo
      # secret (see CONTRIBUTING.md's Release Engineering section) — until
      # then this step is skipped entirely, `TILI_SIGN_IDENTITY` is never
      # set, and `xtask package` below ships unsigned, same as a local/test
      # build.
      - name: Import signing certificate
        if: ${{ env.TILI_SIGNING_CERTIFICATE_P12 != '' }}
        env:
          TILI_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.TILI_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="runner.keychain-db"
          security create-keychain -p "" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          # A freshly created keychain isn't automatically part of
          # `codesign`'s search list (only the default keychain is) —
          # append it to the existing list rather than replacing it, so
          # login.keychain (needed to validate the cert chain against
          # system roots) stays reachable too.
          existing=$(security list-keychains -d user | sed 's/[[:space:]]*"\(.*\)"/\1/')
          security list-keychains -d user -s "$keychain" $existing
          echo "$TILI_SIGNING_CERTIFICATE_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$keychain" -P "$TILI_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain"
          rm -f cert.p12
          # Not `-v` ("valid") — a self-signed certificate never chains to a
          # trusted root, so it's filtered out of that list even though
          # `codesign` itself doesn't require system trust to sign with it
          # (confirmed: it shows up tagged CSSMERR_TP_NOT_TRUSTED under
          # "Matching identities", 0 under "Valid identities only" — that's
          # expected and fine). The identity's quoted name is on the
          # numbered "1) <hash> "<name>" (...)" line, not the first line of
          # output ("Policy: Code Signing") — `grep -m1` scans the whole
          # block for the first quoted string rather than assuming a fixed
          # line number.
          security find-identity -p codesigning "$keychain"
          identity=$(security find-identity -p codesigning "$keychain" | grep -m1 -oE '"[^"]+"' | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::no codesigning identity found in $keychain after import"
            exit 1
          fi
          echo "TILI_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo run -p xtask -- package --target ${{ matrix.target }} --version "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: tili-${{ matrix.target }}
          path: |
            tili-*.tar.gz
            tili-*.tar.gz.sha256

  publish:
    name: publish GitHub release
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    # Job-level env, same reasoning as the `build` job's — lets the two
    # steps below pick the right body/prerelease flag for whether this
    # build was actually signed, instead of the "unsigned" warning staying
    # hardcoded forever after signing went live (which is exactly what
    # happened from v0.11.0 through v0.11.1 — this env + the two `if:`
    # branches below fix that).
    env:
      TILI_SIGNING_CERTIFICATE_P12: ${{ secrets.TILI_SIGNING_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One body for every release, derived from CHANGELOG.md: install and
      # signing lines, the release's highest-signal changes, and a link to the
      # full entry on the website — the canonical changelog. Exits non-zero
      # when the tag has no CHANGELOG.md section, the same "catch drift instead
      # of shipping it" approach as xtask's version-match check.
      - name: Compose release notes
        run: |
          set -euo pipefail
          unsigned=""
          if [ -z "${TILI_SIGNING_CERTIFICATE_P12}" ]; then unsigned="--unsigned"; fi
          node website/scripts/release-notes.mjs "${GITHUB_REF_NAME}" ${unsigned} \
            > release-notes.md

      # The body links to this version's anchor on the website changelog.
      # Cloudflare deploys that page from main and normally finishes long
      # before a draft release is published, so a miss is a warning, not a
      # failure: the release itself is correct and the anchor goes live with
      # the deploy.
      - name: Note if the changelog anchor is not live yet
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          page="https://tili.dezen.me/docs/changelog"
          for attempt in 1 2; do
            html=$(curl -fsS "${page}?v=${RANDOM}${RANDOM}" || true)
            # Here-string, not a pipe: `grep -q` exits on first match, and
            # under `pipefail` the resulting SIGPIPE would read as "not found".
            if grep -q "id=\"v${version}\"" <<<"$html"; then
              exit 0
            fi
            echo "changelog anchor not live yet (attempt ${attempt}/2)"
            sleep 20
          done
          echo "::warning::${page}#v${version} is not live yet — it appears once the website deploy of this commit finishes."

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ env.TILI_SIGNING_CERTIFICATE_P12 == '' }}
          files: dist/*
          body_path: release-notes.md

  sync-homebrew-tap:
    name: sync Homebrew formula
    needs: publish
    runs-on: ubuntu-latest
    # contents: write to push the sync branch (an *unprotected* ref, not
    # main itself); pull-requests: write to open and merge the PR below.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: tili

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update Formula/tili.rb with the released version + sha256s
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arm_sha=$(cut -d' ' -f1 "dist/tili-${version}-aarch64-apple-darwin.tar.gz.sha256")
          intel_sha=$(cut -d' ' -f1 "dist/tili-${version}-x86_64-apple-darwin.tar.gz.sha256")

          formula="tili/Formula/tili.rb"
          perl -0777 -pi -e "s/version \"[^\"]+\"/version \"$version\"/" "$formula"
          perl -0777 -pi -e "s/(on_arm do.*?sha256 \")[^\"]+(\")/\${1}${arm_sha}\${2}/s" "$formula"
          perl -0777 -pi -e "s/(on_intel do.*?sha256 \")[^\"]+(\")/\${1}${intel_sha}\${2}/s" "$formula"

          echo "TILI_VERSION=$version" >> "$GITHUB_ENV"

      # main is rule-protected ("changes must be made through a pull
      # request", must pass the "fmt, clippy, test, build" check) — a
      # direct `git push origin HEAD:main` here is rejected outright for
      # the default GITHUB_TOKEN identity, which isn't in that ruleset's
      # bypass list (confirmed on v0.1.7's release run: this step failed
      # silently every time, leaving the formula stale). Opens a real PR
      # instead so the *ruleset itself* is satisfied rather than needing a
      # bypass — ci.yml already runs that exact check on every PR to main.
      # Deliberately stops at opening the PR rather than merging it
      # itself: merging main is a real, once-per-release, human-reviewable
      # change, not something this job should wave through unattended.
      # Merging is a single "Merge pull request" click in the GitHub UI
      # once the check goes green — no CLI needed.
      - name: Open a PR with the formula update
        working-directory: tili
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/tili.rb; then
            echo "Formula/tili.rb already up to date, nothing to sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="sync-formula-v${TILI_VERSION}"
          git checkout -b "$branch"
          git add Formula/tili.rb
          git commit -m "📝 sync Formula/tili.rb with v${TILI_VERSION}'s released sha256/version"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "📝 sync Formula/tili.rb with v${TILI_VERSION}'s released sha256/version" \
            --body "Automated formula sync for v${TILI_VERSION} — opened as a PR because main requires one. Merge once the required check passes; see release.yml's sync-homebrew-tap job."

      # The real formula homebrew reads (`brew install itsdezen/tap/tili`)
      # lives in a separate `itsdezen/homebrew-tap` repo, not this one —
      # the default GITHUB_TOKEN is scoped to this repo only, so pushing
      # there needs its own PAT (`HOMEBREW_TAP_TOKEN`, a fine-grained token
      # with contents:write on itsdezen/homebrew-tap, added as a repo
      # secret here) — see CONTRIBUTING.md's "Homebrew tap" section.
      - uses: actions/checkout@v4
        with:
          repository: itsdezen/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Push the same formula to itsdezen/homebrew-tap
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          cp ../tili/Formula/tili.rb Formula/tili.rb
          if git diff --quiet -- Formula/tili.rb; then
            echo "Formula/tili.rb already up to date, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tili.rb
          git commit -m "📝 sync Formula/tili.rb with v${TILI_VERSION}'s released sha256/version"
          git push origin HEAD:main

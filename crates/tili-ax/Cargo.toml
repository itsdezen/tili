[package]
name = "tili-ax"
version.workspace = true
edition.workspace = true

[dependencies]
# Pinned exactly: window.rs relies on AXUIElement's #[repr(transparent)]
# layout (an internal implementation detail, not a public API guarantee) to
# obtain a raw AXUIElementRef for the one private API call this project uses.
# A version bump must be a deliberate, reviewed step, not an automatic one.
axuielement = { version = "=0.9.1", features = ["async"] }
core-foundation = "0.10.1"
core-graphics = "0.25.0"
libc = "0.2"
# default-features disabled on the objc2-* crates: each Foundation/AppKit
# class is behind its own feature flag, and the defaults pull in most of
# AppKit (~300 features) — we only need NSWorkspace app-launch/quit
# notifications, not the whole framework surface.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSWorkspace",
    "NSRunningApplication",
    "NSScreen",
    "NSGraphics",
    "libc",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSNotification",
    "NSOperation",
    "NSString",
    "NSDictionary",
    "NSValue",
    "block2",
    # NSDistributedNotificationCenter: screen lock/unlock
    # (`com.apple.screenIsLocked`/`screenIsUnlocked`) is a distributed, not
    # NSWorkspace, notification — see `workspace::register_on_main`'s doc
    # comment.
    "NSDistributedNotificationCenter",
    "bitflags",
] }
block2 = "0.6"
# Only used to hop onto the real main thread from `list_monitors` (a
# background-thread caller) for the one-off `NSScreen` notch query — see
# `notch_heights`'s doc comment.
dispatch2 = "0.3"
tili-tree = { path = "../tili-tree" }
tokio = { workspace = true }
